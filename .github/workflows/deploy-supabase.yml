# Runs the Supabase migrations (12 tables + RLS) against your Supabase project.
#
# HOW TO ENABLE:
#   GitHub repo → Settings → Secrets and variables → Actions → "New repository secret"
#     SUPABASE_ACCESS_TOKEN   Supabase Dashboard → Account → Access Tokens (create one)
#     SUPABASE_PROJECT_ID     Supabase Dashboard → Project Settings → General → Reference ID
#     SUPABASE_DB_PASSWORD    The database password you set when creating the project
#   Then push to main (when supabase/** changes) or run
#   "Actions → Deploy Supabase (migrations) → Run workflow".
#
# ALTERNATIVE (no secrets at all):
#   Open Supabase Dashboard → SQL Editor and paste the contents of
#   supabase/migrations/0001_init.sql, then run it. Result is identical.
#
# The job skips gracefully (green) while its secrets are absent.

name: Deploy Supabase (migrations)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  migrate:
    name: Push migrations
    runs-on: ubuntu-latest
    env:
      HAS_CREDS: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_ID != '' }}
    steps:
      - name: Skip — credentials not set yet
        if: env.HAS_CREDS != 'true'
        run: |
          echo "SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID are not configured — skipping."
          echo "Add repository secrets, or paste supabase/migrations/0001_init.sql into"
          echo "Supabase Dashboard → SQL Editor instead."

      - uses: actions/checkout@v4
        if: env.HAS_CREDS == 'true'

      - uses: supabase/setup-cli@v1
        if: env.HAS_CREDS == 'true'
        with:
          version: latest

      - name: Push migrations
        if: env.HAS_CREDS == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push
